# Merge this section into the original Prompt-Singer data config.yaml.
# This is an overlay, not a replacement for the original model/data config.
# All train/valid TSV samples require fixed prompt text and volume="None".
# Cache IDs must match item_name; use gain=1 when generating the cache.
# Phrases must fit batch_max_frames. No random crop or volume augmentation.
rrq:
  cache_dir: /ABSOLUTE/PATH/TO/diagnostic-output
  arm: rrq  # clean | exposure | rrq; identical rho/seed across comparisons
  rho: 0.5
  seed: 0
